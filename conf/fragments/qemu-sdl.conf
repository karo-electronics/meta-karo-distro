# SDL support for QEMU
#
# Enables the SDL frontend for QEMU, allowing runqemu to open a graphical
# window for the emulated machine.

BB_CONF_FRAGMENT_SUMMARY = "SDL support for QEMU"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment enables the sdl PACKAGECONFIG option for qemu-native and nativesdk-qemu, so runqemu can display a graphical window for the emulated machine."

PACKAGECONFIG:append:pn-qemu-native = " sdl"
PACKAGECONFIG:append:pn-nativesdk-qemu = " sdl"
