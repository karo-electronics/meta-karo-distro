# Systemd as init manager
#
# Removes sysvinit and selects systemd as the init system.

BB_CONF_FRAGMENT_SUMMARY = "Use systemd as init manager"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment removes sysvinit and adds systemd to DISTRO_FEATURES. The distro configuration derives INIT_MANAGER from this, selecting systemd as the init manager. It also enables systemd-udev predictable network interface naming (endX instead of ethX on NXP BSP) and is required by the Wayland and XWayland graphics fragments."

DISTRO_FEATURES:remove = "sysvinit"
DISTRO_FEATURES:append = " systemd"
