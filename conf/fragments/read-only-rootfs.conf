# Read-only root filesystem
#
# Builds images with a read-only rootfs, protecting the root filesystem
# against modification at runtime.

BB_CONF_FRAGMENT_SUMMARY = "Read-only root filesystem"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment enables the read-only-rootfs distro feature. The distro configuration derives the read-only-rootfs image feature from it, and recipes (e.g. base-files) adapt the root filesystem for read-only operation based on it. Works with both sysvinit and systemd."

DISTRO_FEATURES:append = " read-only-rootfs"
