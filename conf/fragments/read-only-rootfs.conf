# Read-only root filesystem
#
# Builds images with a read-only rootfs, protecting the root filesystem
# against modification at runtime.

BB_CONF_FRAGMENT_SUMMARY = "Read-only root filesystem"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment enables the KARO_ROOTFS_READ_ONLY distro flag. The distro configuration derives the read-only-rootfs image feature from the flag, and recipes (e.g. base-files) adapt the root filesystem for read-only operation based on it."

KARO_ROOTFS_READ_ONLY = "1"
