# Read-only root filesystem
#
# Builds images with a read-only rootfs, protecting the root filesystem
# against modification at runtime.

BB_CONF_FRAGMENT_SUMMARY = "Read-only root filesystem"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment adds read-only-rootfs to the image features, so the image's root filesystem is mounted read-only at runtime, protecting it against modification."

EXTRA_IMAGE_FEATURES += "read-only-rootfs"

# Distro-wide flag consumed by recipes (e.g. base-files) that must adapt
# the root filesystem for read-only operation. Recipes cannot see image
# features, so the fragment sets this flag globally as well.
KARO_ROOTFS_READ_ONLY = "1"
