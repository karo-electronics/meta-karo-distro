# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "\
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
        ${LAYERDIR}/recipes-*/*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"
BBMASK:append:use-mainline-bsp = "\
        .*/recipes-karo-nxp/.* \
        .*/dynamic-layers/qt6-layer/recipes-fsl/.*/.* \
"

BBFILE_COLLECTIONS += "karo-distro"
BBFILE_PATTERN_karo-distro := "^${LAYERDIR}/"
BBFILE_PRIORITY_karo-distro = "6"
BBFILE_PRIORITY_karo-distro:use-nxp-bsp = "11"

LAYERDEPENDS_karo-distro:use-mainline-bsp = "karo"
LAYERDEPENDS_karo-distro:use-nxp-bsp = "karo-nxp"
LAYERSERIES_COMPAT_karo-distro = "scarthgap"

FILESYSTEM_PERMS_TABLES = "meta/files/fs-perms.txt"

BBFILES_DYNAMIC += " \
        imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-nnstreamer/*.bbappend \
        imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-nnstreamer/nnshark/*.bbappend \
        imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-fsl/packagegroup/*.bbappend \
        qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-qt/qt6/*.bbappend \
        qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-fsl/packagegroup/*.bbappend \
        rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-core/rauc/*.bbappend \
        rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-core/rauc/*.bb \
        rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-core/bundles/*.bbappend \
        rauc:${LAYERDIR}/dynamic-layers/rauc/recipes-core/bundles/*.bb \
        freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/recipes-core/udev/udev-rules-imx.bbappend \
        freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/recipes-multimedia/gstreamer/*.bb \
        freescale-layer:${LAYERDIR}/dynamic-layers/freescale-layer/recipes-multimedia/gstreamer/*.bbappend \
        stm-tsn-base:${LAYERDIR}/dynamic-layers/stm-tsn-base/*/*/*.bbappend \
"

BBMASK:append = " \
    .*/meta-st/meta-st-stm32mp-tsn-swch/recipes-st/images/.*.bbappend \
    .*/meta-st/meta-st-stm32mp-tsn-swch/recipes-bsp/u-boot/.*.bbappend \
    .*/meta-st/meta-st-stm32mp-tsn-swch/recipes-bsp/tools/.*.bbappend \
"
