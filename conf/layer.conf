# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/recipes-*/*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"
BBFILE_COLLECTIONS += "karo-distro"
BBFILE_PATTERN_karo-distro := "^${LAYERDIR}/"
BBFILE_PRIORITY_karo-distro = "6"
BBFILE_PRIORITY_karo-distro:use-nxp-bsp = "11"

# meta-imx's sysvinit-inittab bbappend installs rc_mxc.S, which respawns a
# second getty on the kernel console device, racing with the getty configured
# through SERIAL_CONSOLES in the Ka-Ro sysvinit-inittab bbappend. Mask it.
BBMASK:append:use-nxp-bsp = " .*/meta-imx.*/recipes-core/sysvinit/sysvinit-inittab_.*\.bbappend "

LAYERDEPENDS_karo-distro:use-mainline-bsp = "karo"
LAYERDEPENDS_karo-distro:use-nxp-bsp = "karo-nxp"
LAYERSERIES_COMPAT_karo-distro = "wrynose"

BBFILES_DYNAMIC += " \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-fsl/packagegroup/*.bbappend \
"
