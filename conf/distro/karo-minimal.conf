require include/karo-distro.inc

DISTRO = "karo-minimal"
DISTRO_NAME = "karo-minimal (Ka-Ro Linux BSP with minimal read-only rootfs)"

DISTRO_FEATURES:remove = " \
    gobject-introspection-data \
    multiarch \
    pulseaudio \
"

DISTRO_FEATURES_OPTED_OUT += " \
    gobject-introspection-data \
    pulseaudio \
"

MACHINE_EXTRA_RRECOMMENDS:remove = "udev-rules-imx"
