require include/karo-distro.inc

DISTRO = "karo-xwayland"
DISTRO_NAME = "karo-xwayland (Ka-Ro Linux BSP with xwayland backend)"

# add support for xwayland
DISTRO_FEATURES:append = " \
    opengl \
    vulkan \
    wayland \
    x11 \
    pam \
"

# add support for ml image
DISTRO_FEATURES:append = " gobject-introspection-data"

PACKAGECONFIG:append:pn-weston      = " rdp"
PACKAGECONFIG:append:pn-weston-init = " rdp"
