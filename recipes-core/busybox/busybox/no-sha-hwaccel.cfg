# busybox >= 1.37 fails to build on non-x86 architectures when
# CONFIG_SHA1_HWACCEL is enabled: sha1_process_block64_shaNI is only
# declared for i386/x86_64 in libbb/hash_md5_sha.c, but referenced
# whenever ENABLE_SHA1_HWACCEL is set. The hardware-accelerated code
# paths are x86-only anyway, so there is nothing to lose by disabling
# the options on other architectures.
# CONFIG_SHA1_HWACCEL is not set
# CONFIG_SHA256_HWACCEL is not set
