# Ka-Ro busybox configuration fragment.
#
# This fragment carries the complete delta between the Ka-Ro busybox
# configuration and the 'busybox/defconfig' shipped by oe-core, which is
# used unmodified as the base configuration. busybox.inc applies all
# .cfg files listed in SRC_URI on top of that base with merge_config.sh
# (see do_configure in busybox.inc).
#
# To change a setting, edit the corresponding line here; when upgrading
# to a new oe-core/busybox version, regenerate the delta by diffing the
# old full defconfig against the new oe-core base defconfig (an easy
# way is 'bitbake busybox -c configure' with a full defconfig shadowed
# via FILESEXTRAPATHS, then comparing the resulting .config against the
# oe-core base and keeping only the differing keys).
#
# Entries deliberately NOT in this fragment:
#  - CONFIG_FEATURE_IPV6, CONFIG_LFS, CONFIG_FDISK_SUPPORT_LARGE_DISKS,
#    CONFIG_LOCALE_SUPPORT, CONFIG_FEATURE_IFUPDOWN_IPV4,
#    CONFIG_FEATURE_IFUPDOWN_IPV6, CONFIG_RFKILL, CONFIG_SELINUX:
#    derived from DISTRO_FEATURES by busybox.inc
#    (features_to_busybox_settings), which wins either way.
#  - CONFIG_PAM (pam.cfg) and CONFIG_SHA1_HWACCEL/CONFIG_SHA256_HWACCEL
#    (no-sha-hwaccel.cfg): governed by the conditional fragments in
#    busybox_%.bbappend.
#  - CONFIG_STATIC, CONFIG_EXTRA_CFLAGS, CONFIG_CROSS_COMPILER_PREFIX:
#    deleted or set by busybox.inc's configmangle.
